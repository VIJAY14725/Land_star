              <span class="contact-card-icon" aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24" focusable="false"><path d="M6.6 2.8 9.3 2.2l2 4.8-2.1 1.5a15 15 0 0 0 6.3 6.3l1.5-2.1 4.8 2-.6 2.7a3 3 0 0 1-3.3 2.3A18.5 18.5 0 0 1 4.3 6.1a3 3 0 0 1 2.3-3.3Z"/></svg></span>

            </article>

    <section class="ftco-section contact-section contact-content bg-light">
      <div class="container">
        <div class="row block-9">
          <div class="col-md-6 order-md-last d-flex">
            <form action="#" class="bg-white p-5 contact-form">
              <span class="section-eyebrow">GET IN TOUCH</span>
              <h2>Send us a message</h2>
              <p class="contact-form-intro">Tell us how we can help with your next real estate opportunity.</p>
              <div class="form-group">
                <input type="text" class="form-control" placeholder="Your Name" aria-label="Your Name">
              </div>
              <div class="form-group">
                <input type="email" class="form-control" placeholder="Your Email" aria-label="Your Email">
              </div>
              <div class="form-group">
                <input type="tel" class="form-control" placeholder="Phone Number" aria-label="Phone Number">
              </div>
              <div class="form-group">
                <textarea name="message" cols="30" rows="7" class="form-control" placeholder="Message" aria-label="Message"></textarea>
              </div>
              <div class="form-group form-check">
                <input class="form-check-input" type="checkbox" id="check1" name="option1" value="something" required>
                <label class="form-check-label" for="check1">By providing your phone number, you agree to receive marketing messages, customer care messages, and account notifications from <strong>LAND-STAR</strong>. Message and Data rates may apply, Message frequency varies. To stop receiving messages, reply 'STOP' at any time. For more information, reply 'HELP'. <a href="privacy-policy.html" target="_blank" rel="noopener noreferrer"><strong>Privacy Policy</strong></a> | <a href="terms-and-conditions.html" target="_blank" rel="noopener noreferrer"><strong>Terms and Conditions</strong></a>.</label>
              </div>
              <div class="form-group">
                <input type="submit" value="Submit" class="btn btn-primary py-3 px-5">
              </div>
            </form>

          </div>

          <div class="col-md-6 d-flex mt-4 mt-md-0">
            <div class="contact-policy">
              <img src="images/IABS-page-1-2025-09-05.jpg" alt="Information about broker services and consumer protection">
            </div>
          </div>
        </div>
      </div>
